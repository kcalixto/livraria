name: CI/CD

on:
  push:
    branches: [main, development]
  pull_request:

env:
  AWS_REGION: sa-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend — install, typecheck e testes
        working-directory: backend
        run: |
          npm ci
          npm run check
          npm test

      - name: Frontend — install, typecheck e testes
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ github.ref == 'refs/heads/main' && 'prd' || 'dev' }}
      SITE_BUCKET: ${{ github.ref == 'refs/heads/main' && 'livraria-serverless-deplyment-prd' || 'livraria-serverless-deployment-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Backend — serverless deploy
        working-directory: backend
        run: |
          npm ci
          npx serverless deploy --stage "$STAGE"

      - name: Frontend — build e sync pro S3
        working-directory: frontend
        run: |
          npm ci
          if [ "$STAGE" = "prd" ]; then
            npm run build
          else
            npx tsc -b && npx vite build --mode development
          fi
          aws s3 sync dist/ "s3://$SITE_BUCKET" --delete

      # o cache da borda já é curto (só assets/* com hash ficam guardados),
      # mas invalidar depois do sync garante que ninguém veja build velho
      - name: Frontend — invalidar cache do CloudFront
        run: |
          DIST=$(aws cloudformation describe-stacks --stack-name "livraria-$STAGE" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteCdnId'].OutputValue" --output text)
          if [ -z "$DIST" ] || [ "$DIST" = "None" ]; then
            echo "distribuicao nao encontrada no stack livraria-$STAGE" >&2
            exit 1
          fi
          ID=$(aws cloudfront create-invalidation --distribution-id "$DIST" \
            --paths '/*' --query 'Invalidation.Id' --output text)
          echo "invalidacao $ID criada na distribuicao $DIST"
          aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$ID"
